name: Test

on:
  push:
    branches: [main]
    paths:
      - src/**
      - test/**
      - site/**
      - vitest.config.mjs
      - wrangler.jsonc
      - wrangler.test.jsonc
      - .prettierrc
      - .prettierignore
      - package.json
      - package-lock.json
      - .github/workflows/test.yml
  pull_request:
    paths:
      - src/**
      - test/**
      - site/**
      - vitest.config.mjs
      - wrangler.jsonc
      - wrangler.test.jsonc
      - .prettierrc
      - .prettierignore
      - package.json
      - package-lock.json
      - .github/workflows/test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test -- --run
      - run: npx wrangler deploy --dry-run
